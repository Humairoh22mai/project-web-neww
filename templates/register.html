{% extends 'base.html' %}
{% block title %}Daftar Member Kantin{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Daftar Member Kantin</h2>
        <form action="/register" method="POST">
            <div class="form-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" class="form-control" placeholder="Contoh: humairoh">
            </div>
            <div class="form-group">
                <label for="email">Alamat Email Kampus</label>
                <input type="text" id="email" name="email" class="form-control" placeholder="humairohmee.07@kampus.com">
            </div>
            <div class="form-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" name="password" class="form-control">
            </div>
            <div class="form-group">
                <label for="confirm">Konfirmasi Sandi</label>
                <input type="password" id="confirm" name="confirm" class="form-control">
            </div>
            <button type="submit" class="btn btn-primary btn-block">Daftar Member Sekarang</button>
        </form>
    </div>
</div>
{% endblock %}
